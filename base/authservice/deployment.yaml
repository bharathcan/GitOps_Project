apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  labels:
    app: authservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      serviceAccountName: authservice-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: server
        image: 508262720940.dkr.ecr.us-west-2.amazonaws.com/authservice:v1
        ports:
        - containerPort: 8081
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
        readinessProbe:
          initialDelaySeconds: 15
          httpGet:
            path: /health
            port: 8081
        livenessProbe:
          initialDelaySeconds: 15
          httpGet:
            path: /health
            port: 8081
        env:
        - name: PORT
          value: "8081"
        - name: DB_SSLMODE
          value: "require"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: DB_PASSWORD
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authservice-db
              key: JWT_SECRET_KEY
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authservice-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::508262720940:role/AuthServiceRole
